name: Daily AI News

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect AI news
        run: python scripts/collect.py --limit 180 --max-per-source 80

      - name: Translate to Chinese
        env:
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
        run: python scripts/translate.py --data data/news.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: update daily AI news"
          git push
